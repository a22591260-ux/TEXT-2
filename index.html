<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的網站主頁</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        nav { background-color: #f4f4f4; padding: 10px; border-radius: 5px; }
        nav a { margin: 0 10px; color: #007bff; text-decoration: none; }
        .form-group { margin-top: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; margin-top: 15px; width: 100%; }
        .btn:hover { background-color: #218838; }
        #message { margin-top: 10px; color: blue; font-weight: bold; }
    </style>
</head>
<body>

    <nav>
        <strong>主頁</strong> | 
        <a href="contact.html">資料存放區</a> | 
        <a href="qa.html">問題 Q&A</a>
    </nav>

    <hr>

    <h1>雲端 ERP 資料輸入</h1>
    <p>輸入的資料將會即時同步至雲端 Google 試算表：</p>

    <div class="form-group">
        <label for="userName">人名：</label>
        <input type="text" id="userName" placeholder="請輸入姓名">
    </div>

    <div class="form-group">
        <label for="clientName">客戶：</label>
        <input type="text" id="clientName" placeholder="請輸入客戶名稱">
    </div>

    <div class="form-group">
        <label for="deviceModel">機種：</label>
        <input type="text" id="deviceModel" placeholder="請輸入機種型號">
    </div>

    <button class="btn" id="submitBtn" onclick="saveData()">傳送至雲端試算表</button>
    <p id="message"></p>

    <script>
        // 🌟 已自動為您填入第二張截圖的 Google 部署網址
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTBFvYyAn_IJS5tp8gW2h2_zRaKTQfJF7aRbx8WWDGNyZALnlomISS5mOJAMF_hMNY/exec";

        function saveData() {
            const name = document.getElementById('userName').value;
            const client = document.getElementById('clientName').value;
            const device = document.getElementById('deviceModel').value;
            const msgEl = document.getElementById('message');
            const btnEl = document.getElementById('submitBtn');

            if(!name || !client || !device) {
                msgEl.style.color = 'red';
                msgEl.innerText = '請填寫所有欄位！';
                return;
            }

            msgEl.style.color = 'orange';
            msgEl.innerText = '資料傳送中，請稍候...';
            btnEl.disabled = true;

            const data = {
                name: name,
                client: client,
                device: device,
                time: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' })
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(() => {
                msgEl.style.color = 'green';
                msgEl.innerText = '🎉 資料已成功寫入 Google 雲端試算表！';
                
                document.getElementById('userName').value = '';
                document.getElementById('clientName').value = '';
                document.getElementById('deviceModel').value = '';
            })
            .catch(error => {
                msgEl.style.color = 'red';
                msgEl.innerText = '錯誤：無法連線至雲端。';
                console.error(error);
            })
            .finally(() => {
                btnEl.disabled = false;
            });
        }
    </script>
</body>
</html>
