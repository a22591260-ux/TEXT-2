<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的網站主頁</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        nav { background-color: #f4f4f4; padding: 10px; border-radius: 5px; }
        nav a { margin: 0 10px; color: #007bff; text-decoration: none; }
        .form-group { margin-top: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; margin-top: 15px; width: 100%; }
        .btn:hover { background-color: #218838; }
        #message { margin-top: 10px; color: blue; font-weight: bold; }
    </style>
</head>
<body>

    <nav>
        <strong>主頁</strong> | 
        <a href="contact.html">資料存放區</a> | 
        <a href="qa.html">問題 Q&A</a>
    </nav>

    <hr>

    <h1>客戶機種資料輸入</h1>
    <p>請在下方輸入資料，系統會自動將資料「堆疊累積」至資料存放區：</p>

    <div class="form-group">
        <label for="userName">人名：</label>
        <input type="text" id="userName" placeholder="請輸入姓名">
    </div>

    <div class="form-group">
        <label for="clientName">客戶：</label>
        <input type="text" id="clientName" placeholder="請輸入客戶名稱">
    </div>

    <div class="form-group">
        <label for="deviceModel">機種：</label>
        <input type="text" id="deviceModel" placeholder="請輸入機種型號">
    </div>

    <button class="btn" onclick="saveData()">新增並堆疊資料</button>
    <p id="message"></p>

    <script>
        function saveData() {
            const name = document.getElementById('userName').value;
            const client = document.getElementById('clientName').value;
            const device = document.getElementById('deviceModel').value;

            if(!name || !client || !device) {
                document.getElementById('message').style.color = 'red';
                document.getElementById('message').innerText = '請填寫所有欄位！';
                return;
            }

            // 1. 先抓取目前已經存了哪些資料（如果沒有，就建立空陣列）
            let currentList = localStorage.getItem('customer_data_list');
            if (currentList) {
                currentList = JSON.parse(currentList); // 轉回陣列
            } else {
                currentList = [];
            }

            // 2. 建立新的一筆資料，並加上時間戳記
            const newRecord = {
                name: name,
                client: client,
                device: device,
                time: new Date().toLocaleString()
            };

            // 3. 把新資料推進（堆疊）陣列中
            currentList.push(newRecord);

            // 4. 將完整的新陣列存回儲存區
            localStorage.setItem('customer_data_list', JSON.stringify(currentList));

            // 清空輸入框方便下一筆輸入
            document.getElementById('userName').value = '';
            document.getElementById('clientName').value = '';
            document.getElementById('deviceModel').value = '';

            document.getElementById('message').style.color = 'green';
            document.getElementById('message').innerText = '資料已成功堆疊！可至「資料存放區」查看與搜尋。';
        }
    </script>

</body>
</html>
