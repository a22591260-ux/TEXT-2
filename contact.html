<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資料存放區</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        nav { background-color: #f4f4f4; padding: 10px; border-radius: 5px; }
        nav a { margin: 0 10px; color: #007bff; text-decoration: none; }
        .export-btn { background-color: #007bff; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
        .search-box { margin: 20px 0; background-color: #e2e3e5; padding: 15px; border-radius: 5px; }
        .search-box input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #17a2b8; border-radius: 4px; }
        .data-item { background-color: #e8f4fd; border: 1px solid #bee5eb; padding: 12px; border-radius: 5px; margin-top: 10px; color: #333; }
        .data-item span { font-weight: bold; color: #0056b3; }
        .time-tag { font-size: 12px; color: #666; text-align: right; margin-top: 5px; }
        #loading { text-align: center; font-weight: bold; color: #666; margin: 20px 0; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">主頁</a> | 
        <strong>資料存放區</strong> | 
        <a href="qa.html">問題 Q&A</a>
    </nav>

    <hr>

    <h1>📂 雲端歷史資料存放區</h1>
    <p>此頁面資料即時與 Google 試算表連線同步：</p>

    <button class="export-btn" onclick="exportToExcel()">📊 匯出目前畫面資料為 Excel (CSV)</button>

    <div class="search-box">
        <label style="font-weight: bold; display: block; margin-bottom: 5px;">🔍 篩選與搜尋雲端資料：</label>
        <input type="text" id="searchBar" onkeyup="filterData()" placeholder="輸入關鍵字自動篩選...">
    </div>

    <div id="loading">正在從 Google 雲端抓取最新資料...</div>
    <div id="data-container"></div>

    <script>
        // 🌟 已自動為您填入第二張截圖的 Google 部署網址
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTBFvYyAn_IJS5tp8gW2h2_zRaKTQfJF7aRbx8WWDGNyZALnlomISS5mOJAMF_hMNY/exec";
        let allRecords = [];

        window.onload = function() {
            fetch(GOOGLE_SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                allRecords = data;
                document.getElementById('loading').style.display = 'none';
                displayData(allRecords);
            })
            .catch(error => {
                document.getElementById('loading').innerText = '❌ 無法讀取雲端資料，請確認試算表已開啟「知道連結的任何人皆可檢視」權限。';
                console.error(error);
            });
        };

        function displayData(records) {
            const container = document.getElementById('data-container');
            container.innerHTML = '';

            if (records.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666;">雲端目前無任何紀錄</p>';
                return;
            }

            for (let i = records.length - 1; i >= 0; i--) {
                const item = records[i];
                const htmlBlock = `
                    <div class="data-item">
                        <div>👤 <span>人名：</span> ${item.name}</div>
                        <div>🏢 <span>客戶：</span> ${item.client}</div>
                        <div>⚙️ <span>機種：</span> ${item.device}</div>
                        <div class="time-tag">🕒 生產時間：${item.time}</div>
                    </div>
                `;
                container.innerHTML += htmlBlock;
            }
        }

        function filterData() {
            const keyword = document.getElementById('searchBar').value.toLowerCase();
            const filtered = allRecords.filter(item => {
                return item.name.toLowerCase().includes(keyword) || 
                       item.client.toLowerCase().includes(keyword) || 
                       item.device.toLowerCase().includes(keyword);
            });
            displayData(filtered);
        }

        function exportToExcel() {
            if (allRecords.length === 0) { alert("無資料可匯出！"); return; }
            let csvContent = "\uFEFF"; 
            csvContent += "人名,客戶,機種,時間\n";
            allRecords.forEach(item => {
                csvContent += `"${item.name}","${item.client}","${item.device}","${item.time}"\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `雲端ERP報表_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
